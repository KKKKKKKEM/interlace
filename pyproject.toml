[project]
name = "interlace"
version = "0.1.0"
description = "An extensible microkernel for typed graphs and event workflows"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kem", email = "531144129@qq.com" },
]
keywords = ["graph", "workflow", "state-machine", "automation", "engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
service = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "jsonrpcserver>=5,<6"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "mypy>=1.11", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/KKKKKKKEM/interlace"
Repository = "https://github.com/KKKKKKKEM/interlace.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["interlace"]

[tool.mypy]
check_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.sdist]
include = [
    "interlace/",
    "README.md",
    "docs/",
    "examples/",
    "web/",
    "LICENSE",
    "pyproject.toml",
]
