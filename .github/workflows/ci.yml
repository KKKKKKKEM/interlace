name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --python "${{ matrix.python-version }}" --with pytest pytest -q
      - name: Run service contracts
        run: uv run --python "${{ matrix.python-version }}" --extra service pytest tests/service -q

  static:
    name: Static checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run Ruff
        run: uv run --with ruff ruff check interlace tests examples
      - name: Run mypy
        run: uv run --extra service mypy interlace
      - name: Check formatting
        run: uv run --with ruff ruff format --check interlace tests examples
      - name: Build distributions
        run: uv build
      - name: Verify installed wheel
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/python - <<'PY'
          import sys

          import interlace

          loaded = {"fastapi", "pydantic", "uvicorn", "jsonrpcserver", "starlette"}
          leaked = sorted(loaded & set(sys.modules))
          if leaked:
              raise SystemExit(f"base import loaded service dependencies: {leaked}")
          PY
